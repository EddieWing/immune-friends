name: Build and deploy game
on:
  push:
    branches: [main]
    paths-ignore:
      - admin/settings.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official Godot and web template
        run: |
          mkdir -p .build web
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o .build/godot.zip
          unzip -q .build/godot.zip -d .build
          chmod +x .build/Godot_v4.7.2-stable_linux.x86_64
          node download-web-template.mjs
      - name: Import project resources
        run: .build/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import
      - name: Check game systems
        run: |
          for test in test_simulation test_systems test_ui_save test_ui_layout test_graphics test_speed_zoom test_gym test_presentation test_debug test_attack_presentation test_source_presentation test_reactions test_virus_behavior test_support_presentation test_attention test_staging_lifecycle test_playtest_iterations test_experimental test_microscope test_core_feedback test_source_placement test_cell_tuner test_hud_a; do
            timeout 60s .build/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/$test.gd
          done
      - name: Export browser game
        run: .build/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web ../web/index.html
      - name: Record deployed version
        run: |
          node -e 'const fs=require("fs"); const version=fs.readFileSync("game/project.godot","utf8").match(/config\/version="([^"]+)"/)[1]; fs.writeFileSync("web/version.json",JSON.stringify({version,commit:process.env.GITHUB_SHA}));'
      - name: Include parameter admin
        run: cp -r admin web/admin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
