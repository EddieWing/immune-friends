<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immune Friends · Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#253b46;font:16px system-ui}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #cad7de;padding:18px 4vw;z-index:2;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:11px 20px;background:#265d65;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}main{max-width:1200px;margin:24px auto;padding:0 24px}aside{background:#e0eeeb;border-radius:12px;padding:18px;margin-bottom:20px}details{background:white;border:1px solid #ccd8df;border-radius:12px;margin:14px 0;padding:16px}summary{font-weight:650;cursor:pointer}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:20px}label{display:flex;flex-direction:column;gap:7px;font-size:14px}input,textarea,select{width:100%;border:1px solid #b9cbd3;border-radius:6px;padding:10px;background:#f8fbfc;color:#203640}textarea{min-height:84px;resize:vertical}.help{cursor:help;border-radius:50%;background:#e4edf2;padding:0 6px;margin-left:6px}small{color:#647980}.connection{display:flex;gap:15px;flex-wrap:wrap;align-items:end}.connection label{flex:1;min-width:190px}#status{font-size:14px;max-width:480px}#search{max-width:300px} .hidden{display:none}a{color:#286575}
